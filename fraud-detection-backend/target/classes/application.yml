spring:
  application:
    name: fraud-detection-api

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# ML Service configuration
ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout:
      connect: 2000
      read: 5000
    retry:
      max-attempts: 1
      delay-ms: 500

# JWT configuration
jwt:
  secret: ${JWT_SECRET:ThisIsADevelopmentSecretKeyThatMustBeAtLeast32Characters}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
