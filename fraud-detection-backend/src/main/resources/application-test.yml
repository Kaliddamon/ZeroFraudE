spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:fraud_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: false

jwt:
  secret: TestSecretKeyThatIsAtLeast32CharactersLong!!
  expiration-ms: 86400000

ml:
  service:
    url: http://localhost:8000

logging:
  level:
    com.frauddetection: DEBUG
